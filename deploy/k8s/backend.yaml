# Two backends from one image:
#   nadien-api    — stateless, scaled out for users (reads, edits, discovery). No scheduler.
#   nadien-worker — one pod with the backup volume (Harvester volumes are ReadWriteOnce): collector
#                   syncs, backups, pushes to devices (/api/collectors, /api/backups and /api/changes are routed
#                   here by the frontend nginx), the daily gitweb schedule and pre-sync pg_dump backups.
# Job state is in the database, so both agree on what is running.
#
# Database connections: every process can open pool + overflow. nadien-api at its HPA maximum:
# 6 pods x 2 processes x (5 + 5) = 120, plus nadien-worker 1 x (10 + 20) = 30: below max_connections=200 (postgres.yaml).
apiVersion: v1
kind: Service
metadata:
  name: nadien-api
spec:
  selector: { app: nadien-api }
  ports: [{ port: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nadien-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: nadien-api }
  template:
    metadata:
      labels: { app: nadien-api }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: nadien-api }
      containers:
        - name: api
          image: nadien-backend
          envFrom:
            - configMapRef: { name: nadien-config }
            - secretRef: { name: nadien-env }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: nadien-db, key: POSTGRES_PASSWORD } }
            - name: NADIEN_DATABASE_URL  # $(VAR) expands only here, after the variable is defined
              value: postgresql+psycopg://nadien:$(POSTGRES_PASSWORD)@nadien-db:5432/nadien
            # Required, so a missing key stops the pod with a clear error instead of each pod making its own: sessions
            # are signed with it, and a per-pod key logs users out at every other request.
            - name: NADIEN_SECRET_KEY
              valueFrom: { secretKeyRef: { name: nadien-env, key: NADIEN_SECRET_KEY } }
            - { name: WEB_CONCURRENCY, value: "2" }
            - { name: NADIEN_DB_POOL_SIZE, value: "5" }
            - { name: NADIEN_DB_MAX_OVERFLOW, value: "5" }
            - { name: NADIEN_SCHEDULER_ENABLED, value: "false" }
          ports: [{ containerPort: 8000 }]
          # Migrations run at startup under an advisory lock, and a large one takes minutes.
          startupProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /api/ready, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:  # let the Service stop sending traffic before the process starts shutting down
              exec: { command: ["sleep", "5"] }
          resources:
            # Measured with 50 users: 0.4 CPU and 1.5 GB per pod on average. Below that, the HPA adds pods for normal
            # traffic, and each new pod recomputes every view from a cold cache.
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 3Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nadien-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nadien-api
  minReplicas: 2
  maxReplicas: 6  # see the connection budget at the top of this file before raising it
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nadien-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: nadien-api }
---
apiVersion: v1
kind: Service
metadata:
  name: nadien-worker
spec:
  selector: { app: nadien-worker }
  ports: [{ port: 8000 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nadien-backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: harvester
  resources:
    requests: { storage: 100Gi }  # 15 pg_dump backups, device host keys
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nadien-worker
spec:
  replicas: 1
  strategy: { type: Recreate }  # the RWO backup volume cannot attach to two pods during a rollout
  selector:
    matchLabels: { app: nadien-worker }
  template:
    metadata:
      labels: { app: nadien-worker }
    spec:
      automountServiceAccountToken: false
      # A push to a device or a sync may be running: give it time. A job cut off anyway is marked failed via its heartbeat.
      terminationGracePeriodSeconds: 600
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001  # the backup volume
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: nadien-backend
          envFrom:
            - configMapRef: { name: nadien-config }
            - secretRef: { name: nadien-env }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: nadien-db, key: POSTGRES_PASSWORD } }
            - name: NADIEN_DATABASE_URL
              value: postgresql+psycopg://nadien:$(POSTGRES_PASSWORD)@nadien-db:5432/nadien
            - name: NADIEN_SECRET_KEY
              valueFrom: { secretKeyRef: { name: nadien-env, key: NADIEN_SECRET_KEY } }
            - name: NADIEN_JOB_TOKEN  # the CronJobs start syncs with it
              valueFrom: { secretKeyRef: { name: nadien-env, key: NADIEN_JOB_TOKEN } }
            - { name: WEB_CONCURRENCY, value: "1" }
            - { name: NADIEN_DB_POOL_SIZE, value: "10" }
            - { name: NADIEN_DB_MAX_OVERFLOW, value: "20" }
            - { name: NADIEN_SCHEDULER_ENABLED, value: "true" }
          ports: [{ containerPort: 8000 }]
          startupProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /api/ready, port: 8000 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:  # a long sync keeps the event loop free, so this also holds during one
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 4Gi }  # a full Observium sync holds ~300k ports in memory
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: backups, mountPath: /backups }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: backups
          persistentVolumeClaim: { claimName: nadien-backups }
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
