# NADIEN on Kubernetes (RKE2 guest cluster on Harvester, storage class "harvester"). Steps: README.md in this folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nadien
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - cronjobs.yaml
images:
  - name: nadien-backend
    newName: registry.example.co.id/neteng/nadien-backend
    newTag: "0.1.0"
  - name: nadien-frontend
    newName: registry.example.co.id/neteng/nadien-frontend
    newTag: "0.1.0"
configMapGenerator:
  - name: nadien-config
    literals:
      - NADIEN_BACKUP_DIR=/backups
      - NADIEN_SEED_DEMO=false
      - NADIEN_DOCS_ENABLED=false
      - NADIEN_TRUSTED_PROXY_HOPS=2
      - NADIEN_CACHE_TTL_S=60
      - NADIEN_SCHEDULE_TIMEZONE=Asia/Jakarta
      - NADIEN_CORS_ORIGINS=["https://nadien.example.co.id"]
