# NADIEN on Kubernetes (RKE2 guest cluster on Harvester, storage class "harvester").
#   kubectl create namespace nadien
#   kubectl -n nadien create secret generic nadien-db --from-literal=POSTGRES_PASSWORD='<random>'
#   kubectl -n nadien create secret generic nadien-env --from-env-file=backend.env   # NADIEN_* (Observium, gitweb, ...)
#   kubectl apply -k deploy/k8s
# Images: build and push backend/ and frontend/ to your registry, then set them below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nadien
resources:
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - cronjobs.yaml
images:
  - name: nadien-backend
    newName: registry.example.co.id/neteng/nadien-backend
    newTag: "0.1.0"
  - name: nadien-frontend
    newName: registry.example.co.id/neteng/nadien-frontend
    newTag: "0.1.0"
configMapGenerator:
  - name: nadien-config
    literals:
      - NADIEN_BACKUP_DIR=/backups
      - NADIEN_SEED_DEMO=false
      - NADIEN_CACHE_TTL_S=60
      - NADIEN_SCHEDULE_TIMEZONE=Asia/Jakarta
      - NADIEN_CORS_ORIGINS=["https://nadien.example.co.id"]
