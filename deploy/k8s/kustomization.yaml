# NADIEN on Kubernetes (Nutanix NKP cluster, storage class "nutanix-volume"). Steps: README.md in this folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nadien
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - traefik-middleware.yaml
  - cronjobs.yaml
  - ollama.yaml
images:
  - name: nadien-backend
    newName: registry.example.co.id/neteng/nadien-backend
    newTag: "0.1.0"
  - name: nadien-frontend
    newName: registry.example.co.id/neteng/nadien-frontend
    newTag: "0.1.0"
configMapGenerator:
  - name: nadien-config
    literals:
      - NADIEN_BACKUP_DIR=/backups
      - NADIEN_SEED_DEMO=false
      - NADIEN_DOCS_ENABLED=false
      - NADIEN_TRUSTED_PROXY_HOPS=2
      - NADIEN_CACHE_TTL_S=60
      - NADIEN_SCHEDULE_TIMEZONE=Asia/Jakarta
      - NADIEN_CORS_ORIGINS=["https://nadien.example.co.id"]
      - NADIEN_AI_OLLAMA_URL=http://nadien-ollama:11434
      - NADIEN_AI_DEFAULT_MODEL=qwen2.5:7b-instruct
      # Expected runs shown under Collectors → Jadwal sync; keep in step with cronjobs.yaml (checked by a test).
      # "cronjob:<name>" in source names the CronJob; the worker's own daily sync-all is "worker".
      - 'NADIEN_SYNC_SCHEDULES=[{"key":"utilization","label":"Utilisasi Observium","kinds":["observium-utilization"],"every_minutes":10,"source":"cronjob:nadien-utilization"},{"key":"observium-full","label":"Observium utama (full)","kinds":["observium"],"daily_at":"01:00","source":"cronjob:nadien-observium-full"},{"key":"observium-csr","label":"Observium CSR","kinds":["observium-csr"],"daily_at":"01:30","source":"cronjob:nadien-observium-csr"},{"key":"sync-all","label":"Sync semua (worker)","kinds":["sync-all-scheduled"],"daily_at":"02:30","grace_minutes":180,"source":"worker"},{"key":"rrd","label":"Histori RRD","kinds":["observium-rrd"],"daily_at":"04:30","source":"cronjob:nadien-rrd"},{"key":"rrd-csr","label":"Histori RRD CSR","kinds":["observium-csr-rrd"],"daily_at":"05:30","source":"cronjob:nadien-rrd-csr"}]'
