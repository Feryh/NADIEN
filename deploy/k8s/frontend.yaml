apiVersion: v1
kind: Service
metadata:
  name: nadien-frontend
spec:
  selector: { app: nadien-frontend }
  ports: [{ port: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nadien-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: nadien-frontend }
  template:
    metadata:
      labels: { app: nadien-frontend }
    spec:
      containers:
        - name: nginx
          image: nadien-frontend
          env:
            - { name: API_UPSTREAM, value: "nadien-api:8000" }
            - { name: WORKER_UPSTREAM, value: "nadien-worker:8000" }
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
