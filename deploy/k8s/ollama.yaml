# Local LLM for the AI assistant: Ollama serving Qwen2.5 7B Instruct on CPU, inside the namespace, so the network
# context sent with each question (hostnames, loopbacks, config snippets) never leaves the cluster.
# The model (~4.7 GB) is pulled once onto the volume at first start; the pod turns Ready only when it is there.
# Without a GPU expect a few tokens per second: the assistant's provider timeout should stay at 180 s or more.
apiVersion: v1
kind: Service
metadata:
  name: nadien-ollama
spec:
  selector: { app: nadien-ollama }
  ports: [{ port: 11434, targetPort: 11434 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nadien-ollama
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nutanix-volume
  resources:
    requests: { storage: 20Gi }  # qwen2.5:7b-instruct is ~4.7 GB; room for one more model
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nadien-ollama
spec:
  replicas: 1
  strategy:
    type: Recreate  # ReadWriteOnce volume: the old pod must let go of it first
  selector:
    matchLabels: { app: nadien-ollama }
  template:
    metadata:
      labels: { app: nadien-ollama }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ollama
          image: ollama/ollama:0.5.7
          command: ["/bin/sh", "-c"]
          # Serve, then make sure the model is on the volume (a no-op after the first start).
          args:
            - |
              ollama serve &
              server=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              ollama pull "$NADIEN_OLLAMA_MODEL"
              wait "$server"
          env:
            - { name: NADIEN_OLLAMA_MODEL, value: "qwen2.5:7b-instruct" }
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_MODELS, value: /models/models }
            - { name: HOME, value: /models }  # ollama keeps its key in ~/.ollama
            - { name: OLLAMA_KEEP_ALIVE, value: "24h" }  # loading 4.7 GB from disk takes longer than an answer
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
          ports: [{ containerPort: 11434 }]
          readinessProbe:
            exec: { command: ["/bin/sh", "-c", "ollama show \"$NADIEN_OLLAMA_MODEL\" >/dev/null"] }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: { port: 11434 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "2", memory: 6Gi }
            limits: { memory: 10Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: nadien-ollama }
        - name: tmp
          emptyDir: {}
