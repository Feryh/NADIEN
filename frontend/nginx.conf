# Rendered by the nginx image's envsubst step (/etc/nginx/templates/*.template) at container start.
# API_UPSTREAM serves the API; WORKER_UPSTREAM takes collector syncs and backups (the process that holds
# the backup volume). With docker compose both point at backend:8000.
upstream nadien_api {
    server ${API_UPSTREAM};
    keepalive 32;
}
upstream nadien_worker {
    server ${WORKER_UPSTREAM};
    keepalive 8;
}

# Behind an HTTPS ingress or reverse proxy this nginx itself sees plain HTTP: pass on what the proxy says, or the
# backend sets the session cookie without Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    client_max_body_size 50m;  # config / CSV uploads

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;

    # Syncs, backups, and pushes to devices: the process holding the volume (backups, device host keys).
    location ~ ^/api/(collectors|backups|changes) {
        proxy_pass http://nadien_worker;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location ~ ^/(api|docs|openapi.json) {
        proxy_pass http://nadien_api;
    }

    # Vite puts a content hash in every asset name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;  # add_header in a location replaces the server's
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
