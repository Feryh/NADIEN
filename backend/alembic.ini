# CLI use: `alembic revision --autogenerate -m "..."`, `alembic upgrade head` (run from backend/).
# The API runs the same migrations on startup (app.database.init_schema); the URL comes from NADIEN_DATABASE_URL.
[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
