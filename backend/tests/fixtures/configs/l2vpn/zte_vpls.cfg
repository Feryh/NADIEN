!<l2vpn>
mpls l2vpn enable
pw pw1
pw pw2
pw pw3
vpls VPLS_112
  mtu 9000
  pseudo-wire pw2 split-horizon scope B
    neighbour 10.20.0.116 vcid 112 cw-preferred
    $
  $
$
vpls VPLS_1489
  mtu 2000
  access-point smartgroup81.1489 split-horizon scope A
    access-params ethernet
    $
  $
  access-point smartgroup82.1489 split-horizon scope A
    access-params ethernet
    $
  $
  pseudo-wire pw1 split-horizon scope B
    neighbour 10.20.0.2 vcid 25489 cw-preferred
      flow-label push pop
    $
  $
  pseudo-wire pw3 split-horizon scope B
    neighbour 10.20.0.3 vcid 25489 cw-preferred
    $
  $
$
!</l2vpn>
