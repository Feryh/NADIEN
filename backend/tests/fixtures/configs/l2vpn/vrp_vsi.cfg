#
mpls l2vpn
#
vsi CUST_1490
 pwsignal ldp
  vsi-id 12490
  control-word enable
  flow-label both
  peer 10.20.0.52
 mtu 2000
 encapsulation ethernet
#
vsi CUST_1491
 pwsignal ldp
  vsi-id 12491
  control-word enable
  peer 10.20.0.52
  peer 10.0.0.1
 mtu 2000
 encapsulation ethernet
#
vsi OTHER_77
 pwsignal ldp
  vsi-id 77
  peer 10.20.0.60 negotiation-vc-id 7700
 mtu 2000
#
vsi KOMPELLA_10 auto
 pwsignal bgp
  route-distinguisher 64500:10
  site 1 range 10 default-offset 1
#
interface Virtual-Ethernet0/1/0.2290
 vlan-type dot1q 2290
 description L2-CUST VLAN 1490
 statistic enable
 l2 binding vsi CUST_1490
#
interface GigabitEthernet0/3/1.1491
 vlan-type dot1q 1491
 l2 binding vsi CUST_1491
#
return
