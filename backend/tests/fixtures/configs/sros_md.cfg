# TiMOS-C-23.10.R1 cpm/x86_64 Nokia 7750 SR Copyright (c) 2000-2023 Nokia.
    configure {
        lag "lag-20" {
            admin-state enable
            description "TO-YGY-AGG-01"
            mode network
            port 1/1/c2/1 {
            }
            port 1/1/c3/1 {
            }
        }
        port 1/1/c1/1 {
            admin-state enable
            description "TO-SBY-P-01"
            ethernet {
                mtu 9212
            }
        }
        port 1/1/c4/1 {
            admin-state disable
        }
        router "Base" {
            interface "system" {
                ipv4 {
                    primary {
                        address 10.0.2.11
                        prefix-length 32
                    }
                }
            }
            interface "to-sby-p-01" {
                port 1/1/c1/1
                ipv4 {
                    primary {
                        address 10.1.2.1
                        prefix-length 30
                    }
                }
            }
            isis 0 {
                area-address [49.0001]
            }
        }
        system {
            name "SMG-PE-01"
        }
        segment-routing {
            segment-routing-v6 {
                locator "MAIN" {
                    prefix {
                        ip-prefix fc00:0:2::/48
                    }
                }
            }
        }
    }
