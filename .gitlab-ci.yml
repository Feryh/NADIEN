# Same checks as .github/workflows/ci.yml, for the company GitLab mirror.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages: [test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.python:
  image: python:3.12-slim
  cache:
    key:
      files: [backend/requirements.txt, backend/requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - cd backend

backend:
  extends: .python
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - python -m pytest -q
    # Migrations match the models (SQLite)
    - NADIEN_DATABASE_URL=sqlite:///./ci.db alembic upgrade head
    - NADIEN_DATABASE_URL=sqlite:///./ci.db alembic check

migrations-postgres:
  extends: .python
  stage: test
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
  variables:
    POSTGRES_USER: nadien
    POSTGRES_PASSWORD: nadien
    POSTGRES_DB: nadien
  script:
    - pip install -r requirements.txt
    # The service is `postgres` on the Docker executor and `localhost` on the Kubernetes executor; the postgis
    # image also restarts once after creating its extensions. Wait for whichever answers, then use it.
    - |
      export NADIEN_DATABASE_URL=$(python - <<'PY'
      import sys, time
      import psycopg
      last = None
      for attempt in range(90):
          for host in ("postgres", "127.0.0.1"):
              try:
                  psycopg.connect(f"host={host} port=5432 user=nadien password=nadien dbname=nadien", connect_timeout=3).close()
                  print(f"postgresql+psycopg://nadien:nadien@{host}:5432/nadien")
                  sys.exit(0)
              except psycopg.OperationalError as exc:
                  last = exc
          time.sleep(2)
      sys.exit(f"PostgreSQL service did not come up: {last}")
      PY
      )
    - echo "Using $NADIEN_DATABASE_URL"
    - alembic upgrade head
    - alembic check
    - alembic downgrade base
    - alembic upgrade head

frontend:
  image: node:20
  stage: test
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.cache/npm]
  script:
    - cd frontend
    - npm ci
    - npm run build

# Needs a runner that allows Docker-in-Docker (privileged). Not every company runner does, and GitHub Actions
# already builds both images, so a failure here is reported without blocking the merge request.
docker:
  image: docker:27
  stage: build
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [backend, frontend]
  allow_failure: true
  script:
    - docker build -t nadien-backend:ci backend
    - docker build -t nadien-frontend:ci frontend
