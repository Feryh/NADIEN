# Same checks as .github/workflows/ci.yml, for the company GitLab mirror.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages: [test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.python:
  image: python:3.12-slim
  cache:
    key:
      files: [backend/requirements.txt, backend/requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - cd backend

backend:
  extends: .python
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - python -m pytest -q
    # Migrations match the models (SQLite)
    - NADIEN_DATABASE_URL=sqlite:///./ci.db alembic upgrade head
    - NADIEN_DATABASE_URL=sqlite:///./ci.db alembic check

migrations-postgres:
  extends: .python
  stage: test
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
  variables:
    POSTGRES_USER: nadien
    POSTGRES_PASSWORD: nadien
    POSTGRES_DB: nadien
    NADIEN_DATABASE_URL: postgresql+psycopg://nadien:nadien@postgres:5432/nadien
  script:
    - pip install -r requirements.txt
    - alembic upgrade head
    - alembic check
    - alembic downgrade base
    - alembic upgrade head

frontend:
  image: node:20
  stage: test
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.cache/npm]
  script:
    - cd frontend
    - npm ci
    - npm run build

# Needs a runner that allows Docker-in-Docker (privileged).
docker:
  image: docker:27
  stage: build
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [backend, frontend]
  script:
    - docker build -t nadien-backend:ci backend
    - docker build -t nadien-frontend:ci frontend
