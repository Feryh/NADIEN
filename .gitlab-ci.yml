# Same checks as .github/workflows/ci.yml, for the company GitLab mirror.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages: [test, build, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  # Full path of the GitLab Kubernetes agent, as `<agent-configuration-project>:<agent-name>`.
  KUBE_AGENT_CONTEXT: "gitlab-agent-universall/gitlab-agent:nkp-batam"
  NADIEN_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

.python:
  image: python:3.12-slim
  cache:
    key:
      files: [backend/requirements.txt, backend/requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - cd backend

backend:
  extends: .python
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - python -m pytest -q
    # Migrations match the models (SQLite)
    - NADIEN_DATABASE_URL=sqlite:///./ci.db alembic upgrade head
    - NADIEN_DATABASE_URL=sqlite:///./ci.db alembic check

migrations-postgres:
  extends: .python
  stage: test
  services:
    - name: postgis/postgis:16-3.4
      alias: postgres
  variables:
    POSTGRES_USER: nadien
    POSTGRES_PASSWORD: nadien
    POSTGRES_DB: nadien
  script:
    - pip install -r requirements.txt
    # The service is `postgres` on the Docker executor and `localhost` on the Kubernetes executor; the postgis
    # image also restarts once after creating its extensions. Wait for whichever answers, then use it.
    - |
      export NADIEN_DATABASE_URL=$(python - <<'PY'
      import sys, time
      import psycopg
      last = None
      for attempt in range(90):
          for host in ("postgres", "127.0.0.1"):
              try:
                  psycopg.connect(f"host={host} port=5432 user=nadien password=nadien dbname=nadien", connect_timeout=3).close()
                  print(f"postgresql+psycopg://nadien:nadien@{host}:5432/nadien")
                  sys.exit(0)
              except psycopg.OperationalError as exc:
                  last = exc
          time.sleep(2)
      sys.exit(f"PostgreSQL service did not come up: {last}")
      PY
      )
    - echo "Using $NADIEN_DATABASE_URL"
    - alembic upgrade head
    - alembic check
    - alembic downgrade base
    - alembic upgrade head

frontend:
  image: node:20
  stage: test
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.cache/npm]
  script:
    - cd frontend
    - npm ci
    - npm run build

# Kaniko builds without a privileged daemon, so this runs on the same unprivileged company runner
# (`integration`) that can't do Docker-in-Docker. Pushes to this project's own GitLab registry.
build-images:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: [backend, frontend]
  parallel:
    matrix:
      - COMPONENT: [backend, frontend]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p /kaniko/.docker
    - |-
      echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/${COMPONENT}"
      --dockerfile "${CI_PROJECT_DIR}/${COMPONENT}/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/nadien-${COMPONENT}:${NADIEN_IMAGE_TAG}"
      --destination "${CI_REGISTRY_IMAGE}/nadien-${COMPONENT}:latest"

# Renders nadien-env from deploy/k8s/nadien.env.template and (re)creates nadien-env/nadien-db from
# masked+protected CI/CD variables (NADIEN_SECRET_KEY, NADIEN_JOB_TOKEN, NADIEN_ADMIN_PASSWORD,
# NADIEN_OBSERVIUM_USER, NADIEN_OBSERVIUM_PASSWORD, NADIEN_DB_PASSWORD). `kubectl apply` instead of
# `create` so re-runs are idempotent. nadien-tls and gitlab-registry stay out-of-band, created manually
# per deploy/k8s/README.md §2 (TLS material and the registry deploy token aren't CI/CD variables here).
apply-secrets:
  stage: deploy
  image:
    name: alpine/k8s:1.30.14
    entrypoint: [""]
  needs: []
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - apk add --no-cache gettext
    - kubectl config use-context "$KUBE_AGENT_CONTEXT"
    - envsubst < deploy/k8s/nadien.env.template > /tmp/nadien.env
    - kubectl -n nadien create secret generic nadien-env --from-env-file=/tmp/nadien.env --dry-run=client -o yaml | kubectl apply -f -
    - rm -f /tmp/nadien.env
    - kubectl -n nadien create secret generic nadien-db --from-literal=POSTGRES_PASSWORD="${NADIEN_DB_PASSWORD}" --dry-run=client -o yaml | kubectl apply -f -

# Applies deploy/k8s with kustomize through the GitLab Kubernetes agent tunnel (see deploy/k8s/README.md).
# Needs this project allow-listed under `ci_access` in the nkp-batam agent's config.yaml, and
# nadien-tls/gitlab-registry already created in the target namespace (see deploy/k8s/README.md §2).
deploy-production:
  stage: deploy
  # kubectl + kustomize with a shell. Not bitnami/kubectl: Bitnami pulled its versioned tags from Docker Hub in 2025
  # (`bitnami/kubectl:1.30: not found`), and its frozen bitnamilegacy copies get no fixes.
  image:
    name: alpine/k8s:1.30.14
    entrypoint: [""]
  needs: [build-images, apply-secrets]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - kubectl config get-contexts
    - kubectl config use-context "$KUBE_AGENT_CONTEXT"
    - cd deploy/k8s
    # NADIEN_DOMAIN is a CI/CD variable (Settings > CI/CD > Variables), not committed, so the real
    # production host never lives in git history.
    - 'sed -i "s#registry.example.co.id/neteng#${CI_REGISTRY_IMAGE}#g; s#newTag: \"0.1.0\"#newTag: \"${NADIEN_IMAGE_TAG}\"#g" kustomization.yaml'
    - 'sed -i "s#nadien.example.co.id#${NADIEN_DOMAIN}#g" ingress.yaml kustomization.yaml'
    - kubectl apply -k .
    - kubectl -n nadien rollout status statefulset/nadien-db --timeout=180s
    - kubectl -n nadien rollout status deploy/nadien-api deploy/nadien-worker deploy/nadien-frontend --timeout=180s

# Restart the app pods so they read changed secrets (after apply-secrets: NADIEN_SECRET_KEY, database password);
# a running pod keeps the values it started with, and deploy-production restarts nothing when the image is unchanged.
# Rolling: nadien-api keeps serving meanwhile.
restart-app:
  stage: deploy
  image:
    name: alpine/k8s:1.30.14
    entrypoint: [""]
  needs: []
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - kubectl config use-context "$KUBE_AGENT_CONTEXT"
    - kubectl -n nadien rollout restart deploy/nadien-api deploy/nadien-worker
    - kubectl -n nadien rollout status deploy/nadien-api deploy/nadien-worker --timeout=300s
