services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nadien
      POSTGRES_USER: nadien
      POSTGRES_PASSWORD: nadien
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nadien -d nadien"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NADIEN_DATABASE_URL: postgresql+psycopg://nadien:nadien@db:5432/nadien
      NADIEN_BACKUP_DIR: /backups
      NADIEN_SEED_DEMO: "true"  # development: demo data on an empty DB (production override sets false)
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backups:/backups
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
